[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=directory
Output=rootfs
ManifestFormat=json

[Content]
Bootable=no
Hostname=boxface
Packages=
        systemd
        systemd-sysv
        udev
        dbus
        dbus-user-session
        passwd
        openssh-server
        iproute2
        iptables
        uidmap
        libstdc++6
        slirp4netns
        socat
        ca-certificates
        curl
        procps
        less
        docker-ce
        docker-ce-cli
        containerd.io
        docker-ce-rootless-extras
        docker-compose-plugin
        docker-buildx-plugin
RemoveFiles=/etc/ssh/ssh_host_*
