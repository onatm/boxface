    <text xml:space="preserve" class="term-text" style="fill: #fcfcfc">
      <tspan y="0.0">
        <tspan dy="1em" x="0.0">  Welcome to </tspan><tspan x="109.50333329" class="br">Codex</tspan><tspan x="151.61999994">, OpenAI&#39;s command-line coding agent                                                        </tspan>
      </tspan><tspan y="18.666662000000002">
        <tspan dy="1em" x="0.0">                                                                                                              </tspan>
      </tspan><tspan y="37.333324000000005">
        <tspan dy="1em" x="0.0" style="fill: #18b218">✓ Signed in with your ChatGPT account</tspan><tspan x="311.66333321">                                                                         </tspan>
      </tspan><tspan y="55.99998600000001">
        <tspan dy="1em" x="0.0">                                                                                                              </tspan>
      </tspan><tspan y="74.66664800000001">
        <tspan dy="1em" x="0.0">  Before you start:                                                                                           </tspan>
      </tspan><tspan y="93.33331000000001">
        <tspan dy="1em" x="0.0">                                                                                                              </tspan>
      </tspan><tspan y="111.99997200000001">
        <tspan dy="1em" x="0.0">  Decide how much autonomy you want to grant Codex                                                            </tspan>
      </tspan><tspan y="130.66663400000002">
        <tspan dy="1em" x="0.0" class="fa">  For more details see the </tspan><tspan x="227.42999991" class="fa un">Codex docs</tspan><tspan x="311.66333321">                                                                         </tspan>
      </tspan><tspan y="149.33329600000002">
        <tspan dy="1em" x="0.0">                                                                                                              </tspan>
      </tspan><tspan y="167.99995800000002">
        <tspan dy="1em" x="0.0">  Codex can make mistakes                                                                                     </tspan>
      </tspan><tspan y="186.66662000000002">
        <tspan dy="1em" x="0.0" class="fa">  Review the code it writes and commands it runs</tspan><tspan x="404.31999984000004">                                                              </tspan>
      </tspan><tspan y="205.33328200000003">
        <tspan dy="1em" x="0.0">                                                                                                              </tspan>
      </tspan><tspan y="223.99994400000003">
        <tspan dy="1em" x="0.0">  Powered by your ChatGPT account                                                                             </tspan>
      </tspan><tspan y="242.66660600000003">
        <tspan dy="1em" x="0.0" class="fa">  Uses your plan&#39;s rate limits and </tspan><tspan x="294.81666655" class="fa un">training data preferences</tspan><tspan x="505.3999998">                                                  </tspan>
      </tspan><tspan y="261.33326800000003">
        <tspan dy="1em" x="0.0">                                                                                                              </tspan>
      </tspan><tspan y="279.99993">
        <tspan dy="1em" x="0.0" style="fill: #18b2b2">  Press </tspan><tspan x="67.38666664" class="fa">enter</tspan><tspan x="109.50333329" style="fill: #18b2b2"> to continue</tspan><tspan x="210.58333325">                                                                                     </tspan>
      </tspan><tspan y="298.66659200000004">
        <tspan dy="1em" x="0.0">                                                                                                              </tspan>
