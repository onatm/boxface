services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
